<!doctype html>
<!--
  MOBY DICK, SCENE BY SCENE
  A risograph sheet of fifteen dollhouse dioramas packed into one stepped
  isometric block, drawn entirely in code.
  One file: no images, no fonts, no libraries, no network.

  Scenes, in book order (chapter numbers from the Project Gutenberg text, ebook #2701):
    1  Ch. 1    Loomings                  Ishmael on the Manhattan wharves
    2  Ch. 3    The Spouter-Inn           the besmoked painting and the whale-jaw bar
    3  Ch. 8    The Pulpit                Father Mapple in his ship's-bow pulpit
    4  Ch. 10   A Bosom Friend            Queequeg and Ishmael by the fire
    5  Ch. 16   The Ship                  the Pequod fitting out, Peleg in his wigwam
    6  Ch. 35   The Mast-Head             Ishmael a hundred feet above the deck
    7  Ch. 36   The Quarter-Deck          Ahab nails the doubloon to the mast
    8  Ch. 44   The Chart                 Ahab tracing courses under the pewter lamp
    9  Ch. 87   The Grand Armada          the boat in the still heart of the herd
    10 Ch. 96   The Try-Works             the fires at night
    11 Ch. 110  Queequeg in His Coffin    the carpenter, the coffin and Pip
    12 Ch. 119  The Candles               corposants on the yard-arms
    13 Ch. 133  The Chase, First Day      the white whale bites Ahab's boat in two
    14 Ch. 135  The Chase, Third Day      Ahab's last dart as the Pequod is struck
    15 Epilogue                           Ishmael on the coffin life-buoy

  Inks: Midnight, Sea Teal, Scarlet, Sunflower, each a halftone screen on cream stock.
-->
<html lang="en"><head><meta charset="utf-8">

<div id="card" aria-live="polite"><div class="no"></div><div class="ti"></div><div class="or"><i></i><b></b><b></b><i></i></div><p class="q"></p></div>
<script>
'use strict';
/* ================================================================
   PRESS CONSTANTS
   ================================================================ */
const INKS=[
  {name:'Midnight', rgb:[40,54,84],   ang:45, off:[0,0]},
  {name:'Sea Teal', rgb:[0,128,136],  ang:15, off:[1.15,-0.7]},
  {name:'Scarlet',  rgb:[232,70,58],  ang:75, off:[-0.95,0.85]},
  {name:'Sunflower',rgb:[255,214,48], ang:0,  off:[0.6,1.25]},
];
const PAPER=[244,236,216];
const PITCH=3.2;             // halftone cell, in sheet units
const MARGIN=130,GAP=34;let SHEET_W=1000,SHEET_H=1000;   // sheet size is set once the scenes are laid out
const TAU=Math.PI*2, RAD=Math.PI/180;

/* ---------- seeded randomness ---------- */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y,s){let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296}
function vnoise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash2(xi,yi,s),b=hash2(xi+1,yi,s),c=hash2(xi,yi+1,s),d=hash2(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>v<a?a:v>b?b:v;
const L2=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
function ellipsePts(cx,cy,rx,ry,n,a0=0,a1=TAU,rot=0){const p=[],cr=Math.cos(rot),sr=Math.sin(rot);for(let i=0;i<=n;i++){const a=a0+(a1-a0)*i/n,x=Math.cos(a)*rx,y=Math.sin(a)*ry;p.push([cx+x*cr-y*sr,cy+x*sr+y*cr])}if(a1-a0>=TAU-1e-6)p.pop();return p}

/* ---------- grain tables for the composite ---------- */
const GR=new Float32Array(65536), BL=new Float32Array(65536);
(function(){const r=mulberry(9001);for(let i=0;i<65536;i++)GR[i]=r();for(let y=0;y<256;y++)for(let x=0;x<256;x++){BL[y*256+x]=vnoise(x/11,y/11,77)*.6+vnoise(x/4,y/4,78)*.4}})();

/* ================================================================
   PLATE: three density canvases that together hold four ink layers.
   A.rgb = tone of inks 0,1,2   B.r = tone ink 3, B.g = line ink 3, B.b = knock-out mask
   C.rgb = linework of inks 0,1,2.  A fill writes every channel (so it knocks out
   what lies behind it); overprints and lines add with 'lighter'.
   ================================================================ */
class Plate{
  constructor(){this.cv=[0,1,2].map(()=>document.createElement('canvas'));this.cx=this.cv.map(c=>c.getContext('2d',{willReadFrequently:true}));this.st=[]}
  begin(w,h,s,ox,oy,seed){
    for(const c of this.cv){if(c.width<w||c.height<h){c.width=Math.max(c.width,w);c.height=Math.max(c.height,h)}}
    for(const x of this.cx){x.setTransform(1,0,0,1,0,0);x.globalCompositeOperation='source-over';x.fillStyle='#000';x.fillRect(0,0,w+2,h+2);x.lineJoin='round';x.lineCap='round'}
    this.w=w;this.h=h;this.s=s;this.m=[s,0,0,s,-ox*s,-oy*s];this.st=[];this.seed=seed;this.wa=1.25;this.wf=1/46;this.lw=1;this.apply();
  }
  apply(){const m=this.m;for(const x of this.cx)x.setTransform(m[0],m[1],m[2],m[3],m[4],m[5])}
  save(){this.st.push({m:this.m.slice(),wa:this.wa,wf:this.wf,lw:this.lw})}
  restore(){const o=this.st.pop();this.m=o.m;this.wa=o.wa;this.wf=o.wf;this.lw=o.lw;this.apply()}
  mul(a,b,c,d,e,f){const m=this.m;this.m=[m[0]*a+m[2]*b,m[1]*a+m[3]*b,m[0]*c+m[2]*d,m[1]*c+m[3]*d,m[0]*e+m[2]*f+m[4],m[1]*e+m[3]*f+m[5]];this.apply()}
  translate(x,y){this.mul(1,0,0,1,x,y)} scale(x,y){this.mul(x,0,0,y,0,0)} rotate(a){const c=Math.cos(a),s=Math.sin(a);this.mul(c,s,-s,c,0,0)}
  wob(p){const f=this.wf,s=this.seed*13.37,a=this.wa;return[p[0]+a*(vnoise(p[0]*f+s,p[1]*f,7)*2-1),p[1]+a*(vnoise(p[0]*f,p[1]*f+s,9)*2-1)]}
  prep(pts,closed,seg=9){const out=[],n=pts.length,m=closed?n:n-1;for(let i=0;i<m;i++){const a=pts[i],b=pts[(i+1)%n],dx=b[0]-a[0],dy=b[1]-a[1],k=Math.max(1,Math.ceil(Math.hypot(dx,dy)/seg));for(let j=0;j<k;j++)out.push(this.wob([a[0]+dx*j/k,a[1]+dy*j/k]))}if(!closed)out.push(this.wob(pts[n-1]));return out}
  _path(P){const p=new Path2D();p.moveTo(P[0][0],P[0][1]);for(let i=1;i<P.length;i++)p.lineTo(P[i][0],P[i][1]);p.closePath();return p}
  _fillP(p,t){const [A,B,C]=this.cx;
    A.fillStyle=`rgb(${t[0]*255|0},${t[1]*255|0},${t[2]*255|0})`;A.fill(p);
    B.fillStyle=`rgb(${(t[3]||0)*255|0},0,255)`;B.fill(p);C.fillStyle='#000';C.fill(p)}
  _overP(p,t){const [A,B]=this.cx;A.globalCompositeOperation=B.globalCompositeOperation='lighter';
    if(t[0]||t[1]||t[2]){A.fillStyle=`rgb(${t[0]*255|0},${t[1]*255|0},${t[2]*255|0})`;A.fill(p)}
    if(t[3]){B.fillStyle=`rgb(${t[3]*255|0},0,0)`;B.fill(p)}A.globalCompositeOperation=B.globalCompositeOperation='source-over'}
  _lineP(p,ink,v=1){const [A,B,C]=this.cx;const g=v*255|0;B.globalCompositeOperation=C.globalCompositeOperation='lighter';
    if(ink===3){B.fillStyle=`rgb(0,${g},${g})`;B.fill(p)}else{C.fillStyle=ink===0?`rgb(${g},0,0)`:ink===1?`rgb(0,${g},0)`:`rgb(0,0,${g})`;C.fill(p);B.fillStyle=`rgb(0,0,${g})`;B.fill(p)}
    B.globalCompositeOperation=C.globalCompositeOperation='source-over'}
  fill(pts,t){if(pts.length<3)return;this._fillP(this._path(this.prep(pts,true)),t)}
  over(pts,t){if(pts.length<3)return;this._overP(this._path(this.prep(pts,true)),t)}
  /* tapered, pressure-varied stroke polygon */
  strokePoly(pts,w,closed,taper=.18){let P=this.prep(pts,closed,6);if(closed){P=P.concat([P[0],P[1]])}
    const n=P.length;if(n<2)return null;const L=[0];for(let i=1;i<n;i++)L.push(L[i-1]+Math.hypot(P[i][0]-P[i-1][0],P[i][1]-P[i-1][1]));const tot=L[n-1]||1;
    const left=[],right=[],s=this.seed*7.1;
    for(let i=0;i<n;i++){const a=P[Math.max(0,i-1)],b=P[Math.min(n-1,i+1)];let dx=b[0]-a[0],dy=b[1]-a[1];const d=Math.hypot(dx,dy)||1;dx/=d;dy/=d;
      const t=L[i]/tot;const tp=taper>0?Math.pow(clamp(Math.min(t,1-t)/taper,0,1),.55):1;const pr=.78+.44*vnoise(L[i]*.05+s,P[i][1]*.01,3);
      const ww=w*this.lw*(.3+.7*tp)*pr*.5;left.push([P[i][0]-dy*ww,P[i][1]+dx*ww]);right.push([P[i][0]+dy*ww,P[i][1]-dx*ww])}
    return left.concat(right.reverse())}
  line(pts,ink=0,w=1.6,closed=false,v=1,taper=.18){const q=this.strokePoly(pts,w,closed,taper);if(q)this._lineP(this._path(q),ink,v)}
  wline(pts,w,t=[0,0,0,0],closed=false){const q=this.strokePoly(pts,w,closed,.3);if(q)this._fillP(this._path(q),t)}
  shape(pts,t,w=1.6,ink=0){this.fill(pts,t);if(w>0)this.line(pts,ink,w,true)}
  clip(pts){const p=this._path(this.prep(pts,true));for(const x of this.cx){x.save();x.clip(p)}}
  unclip(){for(const x of this.cx)x.restore();this.apply()}
  /* light as ink: stepped halftone rings, overprinted */
  glow(cx,cy,rx,ry,ink,dmax,steps=5,gamma=1){for(let i=0;i<steps;i++){const f=Math.pow(1-i/steps,gamma);const t=[0,0,0,0];t[ink]=dmax/steps;this.over(ellipsePts(cx,cy,rx*f,ry*f,Math.max(14,rx*f/4|0)),t)}}
  dot(cx,cy,r,t){this.fill(ellipsePts(cx,cy,r,r,Math.max(8,r*1.5|0)),t)}
}
/* tone helpers: [midnight, teal, scarlet, sunflower] */
const T=(m=0,t=0,s=0,y=0)=>[m,t,s,y];
const dk=(t,a=.15,b=0)=>[clamp(t[0]+a,0,1),clamp(t[1]+b,0,1),t[2],t[3]];
const lt=(t,f=.6)=>t.map(v=>v*f);
const PAL={
  wood:T(.2,0,.36,.5), woodL:T(.08,0,.26,.44), woodD:T(.38,.05,.4,.42), deck:T(.06,0,.2,.4), plank:T(.1,0,.28,.46),
  brick:T(.16,0,.66,.36), plaster:T(0,0,.05,.13), stone:T(.22,.08,.03,.1), iron:T(.72,.2,.05,0), gold:T(0,0,.18,.95),
  sea:T(.12,.6,0,.1), seaD:T(.34,.72,0,.02), sail:T(0,0,.03,.14), rope:T(.2,0,.25,.45), bone:T(0,0,.02,.08),
  skin:T(0,0,.2,.28), skinQ:T(.3,.04,.48,.44), skinD:T(.56,.06,.42,.32), skinT:T(.18,0,.54,.5), skinF:T(.32,0,.36,.4),
  navy:T(.72,.3,0,0), black:T(.9,.12,.06,0), oil:T(.04,0,.1,.85), red:T(0,0,.82,.22), brown:T(.36,0,.3,.42),
  canvas:T(.04,0,.08,.3), white:T(0,0,0,.05), grey:T(.34,.06,0,.04), drab:T(.26,0,.2,.34), teal:T(.1,.7,0,.05), green:T(.18,.55,0,.6),
  hairK:T(.86,.1,.1,0), hairB:T(.5,0,.42,.42), hairG:T(.16,.05,0,.02), hairR:T(.2,0,.6,.5), night:T(.82,.36,0,0), fire:T(0,0,.55,.95)
};
const SHADE=T(.13,.1,0,0), SHADE_SKIN=T(.07,0,.14,0);

/* ================================================================
   COMPOSITE: density layers -> halftone dots of four inks, multiplied on paper.
   ================================================================ */
const INKC=INKS.map((k,i)=>({i,c:Math.cos(k.ang*RAD),s:Math.sin(k.ang*RAD),ox:k.off[0],oy:k.off[1],
  fr:1-k.rgb[0]/255,fg:1-k.rgb[1]/255,fb:1-k.rgb[2]/255,
  tb:i<3?0:1, tc:i<3?i:0, lb:i<3?2:1, lc:i<3?i:1}));
function cellTables(bufs,W,H,s,ox,oy){ /* per ink: tone, dot size and jitter for every screen cell, sampled once */
  const p=PITCH,ps=p*s,src=bufs;const tabs=[];
  for(const k of INKC){const cx=[ox-k.ox,ox+W/s-k.ox],cy=[oy-k.oy,oy+H/s-k.oy];let u0=1e9,u1=-1e9,v0=1e9,v1=-1e9;
    for(const x of cx)for(const y of cy){const u=(x*k.c+y*k.s)/p,v=(-x*k.s+y*k.c)/p;u0=Math.min(u0,u);u1=Math.max(u1,u);v0=Math.min(v0,v);v1=Math.max(v1,v)}
    const iu0=Math.floor(u0)-1,iv0=Math.floor(v0)-1,nu=Math.floor(u1)-iu0+2,nv=Math.floor(v1)-iv0+2,n=nu*nv;
    const TT=new Float32Array(n),R2=new Float32Array(n),KS=new Float32Array(n),JX=new Float32Array(n),JY=new Float32Array(n);const arr=src[k.tb],ch=k.tc;
    for(let b=0;b<nv;b++)for(let a=0;a<nu;a++){const iu=iu0+a,iv=iv0+b;const cu=(iu+.5)*p,cv=(iv+.5)*p;const wx=cu*k.c-cv*k.s,wy=cu*k.s+cv*k.c;
      let px=((wx-ox)*s)|0,py=((wy-oy)*s)|0;if(px<0||py<0||px>=W||py>=H)continue;const t=arr[(py*W+px)*4+ch]/255;if(t<.004)continue;
      const h=hash2(iu,iv,k.i+11),js=.94+((h*13.7)%1)*.12,q=b*nu+a;TT[q]=t;JX[q]=(h-.5)*.08;JY[q]=((h*7.13)%1-.5)*.08;
      if(t<.5){const r=Math.max(.04,Math.sqrt(t/Math.PI)*js);R2[q]=r*r;KS[q]=ps/(2*r)}else{const r=Math.max(.04,Math.sqrt((1-t)/Math.PI)*(2-js));R2[q]=r*r;KS[q]=ps/(2*r)}}
    tabs.push({iu0,iv0,nu,nv,TT,R2,KS,JX,JY})}
  return tabs}
const RF=new Float32Array(8192),GF=new Float32Array(8192),BF=new Float32Array(8192),OC=new Uint8Array(8192),MC=new Float32Array(8192);
function composite(bufs,W,H,s,ox,oy,out,sprite,passes,rowFrom,rowTo){
  const o=out.data,p=PITCH,ps=p*s,flat=ps<2.7?Math.min(1,(2.7-ps)/1.3):0;
  if(!bufs.tabs)bufs.tabs=cellTables(bufs,W,H,s,ox,oy);
  const occ=bufs.occ,BS=bufs.bs,bw=bufs.bw,mask=bufs[1],P0=PAPER[0],P1=PAPER[1],P2=PAPER[2];const inv=1/s;
  for(let j=rowFrom;j<rowTo;j++){
    const wy=oy+(j+.5)*inv,orow=((j/BS)|0)*bw;
    for(let i=0;i<W;i++){OC[i]=occ[orow+((i/BS)|0)];RF[i]=1;GF[i]=1;BF[i]=1;MC[i]=0}
    const gy=(Math.floor(wy*1.4)&255)<<8,by=(Math.floor(wy*.9)&255)<<8;
    for(let oi=0;oi<4;oi++){
      const k=INKC[3-oi],tt=bufs.tabs[3-oi];const TT=tt.TT,R2=tt.R2,KS=tt.KS,JX=tt.JX,JY=tt.JY,iu0=tt.iu0,iv0=tt.iv0,nu=tt.nu;
      const kc=k.c/p,kss=k.s/p,kr=k.fr,kg=k.fg,kb=k.fb,ki=k.i,gofs=ki*9973,bofs=ki*41;
      const sy=wy-k.oy;const lsrc=bufs[k.lb],lc=k.lc;let lj=j-((k.oy*s+.5)|0);if(lj<0)lj=0;else if(lj>=H)lj=H-1;const lrow=lj*W,lofx=(k.ox*s+.5)|0;
      const sx0=ox+.5*inv-k.ox;let u=sx0*kc+sy*kss,v=-sx0*kss+sy*kc;const du=kc*inv,dv=-kss*inv;
      for(let i=0;i<W;i++,u+=du,v+=dv){
        if(!OC[i])continue;
        const iu=Math.floor(u),iv=Math.floor(v);const q=(iv-iv0)*nu+(iu-iu0);const tv=TT[q];let cov=0;
        if(tv>0){const dx=u-iu-.5-JX[q],dy=v-iv-.5-JY[q];
          if(tv<.5)cov=(R2[q]-dx*dx-dy*dy)*KS[q]+.5;else{const ax=.5-(dx<0?-dx:dx),ay=.5-(dy<0?-dy:dy);cov=(ax*ax+ay*ay-R2[q])*KS[q]+.5}
          cov=cov<0?0:cov>1?1:cov;if(flat)cov+=(tv-cov)*flat}
        let li=i-lofx;if(li<0)li=0;else if(li>=W)li=W-1;const lv=lsrc[(lrow+li)*4+lc]*.0039216;if(lv>cov)cov=lv;
        if(cov>0){const wx=ox+(i+.5)*inv;const g=GR[(((Math.floor(wx*1.4)&255)|gy)+gofs)&65535];
          if(cov>.55){const bl=BL[((Math.floor(wx*.9+bofs)&255))|by];cov*=(g<.04?.25:1)*(1-(bl>.58?(bl-.58)*.8:0))}
          cov*=.92+.08*g;if(cov>MC[i])MC[i]=cov;RF[i]*=1-cov*kr;GF[i]*=1-cov*kg;BF[i]*=1-cov*kb}
      }
      if(passes){const d=passes[oi].data;for(let i=0,x=j*W*4;i<W;i++,x+=4){d[x]=P0*RF[i];d[x+1]=P1*GF[i];d[x+2]=P2*BF[i];d[x+3]=OC[i]?Math.max(mask[x+2],MC[i]*255):0}}
    }
    for(let i=0,x=j*W*4;i<W;i++,x+=4){o[x]=P0*RF[i];o[x+1]=P1*GF[i];o[x+2]=P2*BF[i];if(sprite===2){o[x]=255*RF[i];o[x+1]=255*GF[i];o[x+2]=255*BF[i]}o[x+3]=sprite===true?(OC[i]?Math.max(mask[x+2],MC[i]*255):0):255}
  }

function pause(){tour.on=false;lastInput=now;fly=null}
function toWorld(sx,sy){return[cam.x+(sx-VW/2)/cam.z,cam.y+(sy-VH/2)/cam.z]}
function zoomAt(sx,sy,f){const zmin=fitCam().z*.55,zmax=MOBILE?4:7;const w=toWorld(sx,sy);cam.z=clamp(cam.z*f,zmin,zmax);cam.x=w[0]-(sx-VW/2)/cam.z;cam.y=w[1]-(sy-VH/2)/cam.z}
function hitScene(sx,sy){const w=toWorld(sx,sy);const c=.8660254*ISO_K,s=.5*ISO_K;let best=-1,bd=1e18;
  for(const h of [.5,3.5]){for(const sc of SC){const t=sc.S.tile;const a=(w[0]-sc.x-sc.S.ox)/c,b=(w[1]-sc.y-sc.S.oy+(h-sc.lift)*ISO_K)/s;const x=(a+b)/2,y=(b-a)/2;
      if(x>=t[0]&&x<=t[0]+t[2]&&y>=t[1]&&y<=t[1]+t[3]){const q=tileCenter(sc),d=(q[0]-w[0])**2+(q[1]-w[1])**2;if(d<bd){bd=d;best=sc.i}}}if(best>=0)return best}
  return best}
/* the diorama the viewer is looking at: the tour's stop, or whatever sits under the middle of the view */
function focusScene(){if(tour.on&&tour.phase==='hold'&&tour.idx>=0&&tour.idx<SC.length)return tour.idx;return hitScene(VW/2,VH>VW*1.2?VH*.36:VH/2)}
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});pause();vel={x:0,y:0};cv.classList.add('drag');
  if(pointers.size===1){drag={x:e.clientX,y:e.clientY,t:now,vx:0,vy:0};
    if(e.pointerType!=='mouse'){if(now-(cv._tap||-9)<.32&&Math.hypot(e.clientX-(cv._tx||0),e.clientY-(cv._ty||0))<30){const i=hitScene(e.clientX,e.clientY);if(i>=0)flyTo(sceneCam(i))}cv._tap=now;cv._tx=e.clientX;cv._ty=e.clientY}}
  else drag=null});
cv.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const p=pointers.get(e.pointerId);const px=p.x,py=p.y;p.x=e.clientX;p.y=e.clientY;lastInput=now;
  if(pointers.size===2){const [a,b]=[...pointers.values()];const o=a===p?b:a;const d0=Math.hypot(px-o.x,py-o.y),d1=Math.hypot(p.x-o.x,p.y-o.y);const mx=(p.x+o.x)/2,my=(p.y+o.y)/2;
    cam.x-=(p.x-px)/2/cam.z;cam.y-=(p.y-py)/2/cam.z;if(d0>0)zoomAt(mx,my,d1/d0);return}
  if(drag){const dx=e.clientX-px,dy=e.clientY-py;cam.x-=dx/cam.z;cam.y-=dy/cam.z;const dt=Math.max(1/240,now-drag.t);drag.vx=lerp(drag.vx,-dx/cam.z/dt,.35);drag.vy=lerp(drag.vy,-dy/cam.z/dt,.35);drag.t=now}});
const up=e=>{pointers.delete(e.pointerId);if(pointers.size===0){cv.classList.remove('drag');if(drag&&now-drag.t<.1)vel={x:drag.vx,y:drag.vy};drag=null}lastInput=now};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();pause();const d=e.deltaMode===1?e.deltaY*16:e.deltaMode===2?e.deltaY*VH:e.deltaY;zoomAt(e.clientX,e.clientY,Math.exp(-d*(e.ctrlKey?.01:.0016)))},{passive:false});
cv.addEventListener('dblclick',e=>{pause();const i=hitScene(e.clientX,e.clientY);if(i>=0)flyTo(sceneCam(i))});
addEventListener('keydown',e=>{const k=e.key;if(k==='c'||k==='C'){cardOn=!cardOn;return}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','=','-','_','0'].includes(k)){e.preventDefault();pause();const s=220/cam.z;
    if(k==='ArrowLeft')vel.x-=s*3.2;if(k==='ArrowRight')vel.x+=s*3.2;if(k==='ArrowUp')vel.y-=s*3.2;if(k==='ArrowDown')vel.y+=s*3.2;
    if(k==='+'||k==='=')flyTo({x:cam.x,y:cam.y,z:Math.min(cam.z*1.35,MOBILE?4:7)},.45);if(k==='-'||k==='_')flyTo({x:cam.x,y:cam.y,z:Math.max(cam.z/1.35,fitCam().z*.55)},.45);if(k==='0')flyTo(fitCam(),1.2)}});
addEventListener('resize',()=>{resize();if(tour.phase==='intro'||tour.phase==='overview')cam=fitCam()});
addEventListener('gesturestart',e=>e.preventDefault());

/* chapter card */
const card=document.getElementById('card'),cNo=card.querySelector('.no'),cTi=card.querySelector('.ti'),cQ=card.querySelector('.q');let cardScene=-1,cardShown=false,settleT=0;
function fillCard(i){const m=SC[i].m;const a=INKS[m.accent],b=INKS[(m.accent+1)%3];card.style.setProperty('--ink',`rgb(${a.rgb})`);card.style.setProperty('--ink2',`rgb(${b.rgb})`);card.style.setProperty('--inkt',m.accent===3?'rgb(168,118,0)':`rgb(${a.rgb})`);
  cNo.textContent=m.num;cTi.textContent=m.title;cQ.innerHTML='';const oq=document.createElement('span');oq.className='oq';oq.textContent='“';const dc=document.createElement('span');dc.className='dc';dc.textContent=m.quote[0];cQ.append(oq,dc,document.createTextNode(m.quote.slice(1)+'”'))}
function updateCard(moving){let want=-1;if(cardOn&&!moving){const j=focusScene();if(j>=0){const f=frameOf(SC[j]);if((f.y1-f.y0)*cam.z>VH*.5||(f.x1-f.x0)*cam.z>VW*.62)want=j}}
  if(want!==cardScene||!cardOn||moving){if(cardShown){card.classList.remove('on');cardShown=false;settleT=now}if(want>=0&&!moving&&now-settleT>.5){if(want!==cardScene)fillCard(want);cardScene=want;card.classList.add('on');cardShown=true}else if(want<0)cardScene=-1}
  else if(want>=0&&!cardShown&&now-settleT>.5){card.classList.add('on');cardShown=true}}

/* ================================================================
   FRAME
   ================================================================ */
let prev={x:cam.x,y:cam.y,z:cam.z},stillFor=0,lastT=0;
function tick(ms){now=ms/1000-T0;const dt=Math.min(.05,now-lastT||.016);lastT=now;frameNo++;
  /* camera */
  let moving=false;
  if(fly){const u=clamp((now-fly.t0)/fly.dur,0,1);const q=fly.path(fly.S*ease(u));cam.x=q.x;cam.y=q.y;cam.z=VW/q.w;moving=true;if(u>=1){cam={x:fly.end.x,y:fly.end.y,z:fly.end.z};fly=null;if(tour.on&&tour.phase==='fly'){tour.phase='hold';tour.t0=now}}}
  if(!drag&&(Math.abs(vel.x)+Math.abs(vel.y))*cam.z>2){cam.x+=vel.x*dt;cam.y+=vel.y*dt;const f=Math.exp(-4.2*dt);vel.x*=f;vel.y*=f;moving=true;lastInput=now}else if(!drag){vel.x=vel.y=0}
  cam.x=clamp(cam.x,0,SHEET_W);cam.y=clamp(cam.y,0,SHEET_H);
  /* tour */
  const printedAll=SC.every(sc=>sc.print>=0&&now-sc.print>1.3);
  if(tour.phase==='intro'&&printedAll){if(!tour.t0)tour.t0=now;if(now-tour.t0>2.2&&tour.on){tour.idx=0;tour.phase='fly';flyTo(sceneCam(0),3.6)}}
  if(tour.on&&tour.phase==='hold'){const i=tour.idx;const hold=i>=SC.length?4.5:6.2+SC[i].m.quote.length*.028;const e=now-tour.t0;
    if(i<SC.length&&e<hold){const c=sceneCam(i),f=SC[i].m.focus,g=ease(clamp(e/hold,0,1))*.07;const tc=tileCenter(SC[i]),fx=lerp(c.x,tc[0],.5),fy=lerp(c.y,tc[1],.5);cam.z=c.z*(1+g);cam.x=lerp(c.x,fx,g*1.6);cam.y=lerp(c.y,fy,g*1.6)}
    if(e>=hold){tour.idx=i>=SC.length?0:i+1;tour.phase='fly';flyTo(tour.idx>=SC.length?fitCam():sceneCam(tour.idx))}}
  if(!tour.on&&!drag&&pointers.size===0&&!fly&&now-lastInput>14&&tour.phase!=='intro'){tour.on=true;let i=hitScene(VW/2,VH/2);if(i<0){let bd=1e18;for(const sc of SC){const q=tileCenter(sc),d=(q[0]-cam.x)**2+(q[1]-cam.y)**2;if(d<bd){bd=d;i=sc.i}}}else if(cardShown)i=(i+1)%SC.length;tour.idx=i;tour.phase='fly';flyTo(sceneCam(i))}
  if(tour.phase==='intro'&&!tour.on&&printedAll)tour.phase='free';
  const dm=Math.abs(cam.x-prev.x)*cam.z+Math.abs(cam.y-prev.y)*cam.z+Math.abs(cam.z/prev.z-1)*VW;prev={x:cam.x,y:cam.y,z:cam.z};
  const settled=!moving&&!drag&&(dm<1.2||(tour.on&&tour.phase==='hold'));
  /* visible scenes and what they need */
  const need=cam.z*DPR,L=pickLevel(need);const vx0=cam.x-VW/2/cam.z,vx1=cam.x+VW/2/cam.z,vy0=cam.y-VH/2/cam.z,vy1=cam.y+VH/2/cam.z;
  const vis=SC.filter(sc=>sc.x<vx1&&sc.x+sc.bw>vx0&&sc.y<vy1&&sc.y+sc.bh>vy0).sort((a,b)=>a.ord-b.ord);  // back to front
  wantList.length=0;if(L!==BASE){for(const sc of vis.slice().sort((a,b)=>(dist2(a)-dist2(b))))wantList.push({sc,L})}
  if(tour.on&&tour.phase==='hold'&&tour.idx+1<SC.length){const c=sceneCam(tour.idx+1);wantList.push({sc:SC[tour.idx+1],L:pickLevel(c.z*DPR)})}
  /* printing schedule */
  for(const sc of SC){if(sc.print<0){const e=sc.tiles.get(BASE);const prevSc=SC[sc.i-1];if(e&&e.bg[0]&&sc.passes&&(!sc.fg||e.fg[0])&&(!prevSc||(prevSc.print>=0&&now-prevSc.print>.36))&&now>.6){sc.print=now}}}
  stepJob(tour.phase==='intro'?22:moving||drag?7:13);
  render(vis,L);
  updateCard(!settled);
  requestAnimationFrame(tick)}

const REQ=[];
/* the screen area above a tile's footprint: anything drawn here by a tile in front hides this one */
function viewCol(sc){const t=sc.S.tile,g=-sc.lift,l=scP(sc,t[0],t[1]+t[3],g),f=scP(sc,t[0]+t[2],t[1]+t[3],g),r=scP(sc,t[0]+t[2],t[1],g);
  const p=new Path2D();p.moveTo(l[0],l[1]);p.lineTo(f[0],f[1]);p.lineTo(r[0],r[1]);p.lineTo(r[0],-1e4);p.lineTo(l[0],-1e4);p.closePath();return p}
function drawScene(sc,L,v,f12,z,alpha,clip,evenodd){if(sc.print<0)return;const pe=now-sc.print;ctx.globalAlpha=alpha;const pop=!!clip;
  if(clip){ctx.save();ctx.clip(clip,evenodd?'evenodd':'nonzero')}
    if(pe<1.3&&sc.passes){const pi=Math.min(3,Math.floor(pe/.32)),pf=clamp((pe-pi*.32)/.32,0,1);
      if(pi>0)ctx.drawImage(sc.passes[pi-1],sc.x,sc.y,sc.bw,sc.bh);ctx.save();ctx.beginPath();ctx.rect(sc.x,sc.y,sc.bw,sc.bh*ease(pf));ctx.clip();ctx.drawImage(sc.passes[pi],sc.x,sc.y,sc.bw,sc.bh);ctx.restore();if(pop)ctx.restore();ctx.globalAlpha=1;return}
    const bt=bestTile(sc,L,v,'bg');if(bt)ctx.drawImage(bt[0],sc.x,sc.y,sc.bw,sc.bh);
    /* actors */
    const aL=Math.min(pickLevel(z*DPR),4);const list=[];
    sc.actors.forEach((a,ai)=>{const p=a.place(now);list.push({a,ai,p})});list.sort((a,b)=>(a.p.y+a.a.z)-(b.p.y+b.a.z));
    ctx.globalCompositeOperation='multiply';for(const {a,p} of list){if(!a.shadow)continue;const sh=shadowSprite(aL);const w=a.shadow/sh.r;ctx.drawImage(sh.cv,sc.x+p.x-sh.r*w,sc.y+p.y-sh.r*w/2,2*sh.r*w,sh.r*w)}ctx.globalCompositeOperation='source-over';
    for(const {a,ai,p} of list){const f=(f12+a.ph)%a.frames;let s=spriteFor(sc,ai,a,f,p.flip,aL,false);if(s)a.last=s;else{REQ.push({sc,ai,a,f,flip:p.flip,L:aL,pri:a.last?(a.last.L===aL?2:1):0});s=a.last}if(!s)continue;
      ctx.save();ctx.translate(sc.x+p.x,sc.y+p.y);const r=(a.rot||0)+(p.rot||0);if(r)ctx.rotate(r);ctx.drawImage(s.cv,s.x0,s.y0,s.cv.width/s.L,s.cv.height/s.L);ctx.restore()}
    if(sc.fg){const ft=bestTile(sc,L,v,'fg');if(ft)ctx.drawImage(ft[0],sc.x+sc.fg.bb[0],sc.y+sc.fg.bb[1],sc.fg.bb[2]-sc.fg.bb[0],sc.fg.bb[3]-sc.fg.bb[1])}if(pop)ctx.restore();ctx.globalAlpha=1}
function dist2(sc){const q=tileCenter(sc);return(q[0]-cam.x)**2+(q[1]-cam.y)**2}
function render(vis,L){const z=cam.z;
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#1d1b18';ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(DPR*z,0,0,DPR*z,DPR*(VW/2-cam.x*z),DPR*(VH/2-cam.y*z));
  ctx.save();ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=36*DPR;ctx.shadowOffsetY=10*DPR*Math.min(1,z*3);ctx.fillStyle=`rgb(${PAPER})`;ctx.fillRect(0,0,SHEET_W,SHEET_H);ctx.restore();
  marks();
  const sl=Math.min(pickLevel(z*DPR),2.2);if(!swatch||swatch.L!==sl)bakeSwatch(sl);ctx.drawImage(swatch.cv,swatch.x0,swatch.y0,swatch.w,swatch.h);
  const v=Math.floor(now*3)%3;const f12=Math.floor(now*12);REQ.length=0;
  ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
  /* zoomed into one scene: tiles standing in front of it print as a faint ghost over it (an x-ray),
     so masts and walls never block the room you are looking at. Draw order itself never changes. */
  const fi=vis.length>1?focusScene():-1,fs=fi>=0?SC[fi]:null;let ga=0,col=null;
  if(fs&&vis.includes(fs)){const f=frameOf(fs);ga=clamp((Math.max((f.x1-f.x0)*z/VW,(f.y1-f.y0)*z/VH)-.5)/.35,0,1);if(ga>0){col=new Path2D();col.rect(-1e4,-1e4,SHEET_W+2e4,SHEET_H+2e4);col.addPath(viewCol(fs))}}
  let past=false;for(const sc of vis){if(past&&ga>0){drawScene(sc,L,v,f12,z,1,col,true);drawScene(sc,L,v,f12,z,1-.9*ga,viewCol(fs))}else drawScene(sc,L,v,f12,z,1);if(sc===fs)past=true}
  REQ.sort((a,b)=>a.pri-b.pri);const end=performance.now()+(MOBILE?5:8);for(const r of REQ){if(performance.now()>end)break;const s=spriteFor(r.sc,r.ai,r.a,r.f,r.flip,r.L,true);if(s)r.a.last=s}
  if(z*DPR>.6){ctx.globalCompositeOperation='multiply';const m=new DOMMatrix();m.scaleSelf(1.05,1.05);grain.setTransform(m);ctx.fillStyle=grain;ctx.fillRect(Math.max(0,cam.x-VW/2/z),Math.max(0,cam.y-VH/2/z),Math.min(SHEET_W,VW/z),Math.min(SHEET_H,VH/z));ctx.globalCompositeOperation='source-over'}
}
requestAnimationFrame(tick);
</script>
</body></html>
